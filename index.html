<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/logo.png" />
<meta name="theme-color" content="#1e3a8a" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JvSoft Finanças</title>
    <script>
      // Aplica o tema (incluindo preferência do sistema) ANTES do React montar,
      // evitando o "flash" de tela ao recarregar a página.
      (function () {
        try {
          const theme = localStorage.getItem('theme');
          const prefDark = localStorage.getItem('pref_dark');

          if (theme === 'dark' || (theme !== 'light' && theme !== 'system' && prefDark === 'true')) {
             document.documentElement.classList.add('dark');
          } else if (theme === 'system' || (!theme && !prefDark)) {
             if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
               document.documentElement.classList.add('dark');
             }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
